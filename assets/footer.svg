<svg width="1280" height="190" viewBox="0 0 1280 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ftTitle ftDesc">
  <title id="ftTitle">Estatística, dados, programação e análises</title>
  <desc id="ftDesc">Banner de encerramento com emblema animado e a mensagem sobre transformar dados em decisão.</desc>
  <defs>
    <linearGradient id="ftBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070C18"/><stop offset="0.55" stop-color="#10162A"/><stop offset="1" stop-color="#090F1E"/>
    </linearGradient>
    <linearGradient id="ftBorder" x1="0" y1="0" x2="1280" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6DB8B"/><stop offset="0.4" stop-color="#8B5CF6"/><stop offset="0.75" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/>
      <animate attributeName="x1" values="0;400;0" dur="13s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ftAccent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B5CF6"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="ftCore" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#E0F2FE"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="ftGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ftGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6B7AA0" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="190" rx="24" fill="url(#ftBg)"/>
  <rect x="18" y="18" width="1244" height="154" rx="20" fill="url(#ftGrid)" stroke="url(#ftBorder)" stroke-width="2"/>
  <rect x="31" y="31" width="1218" height="128" rx="16" fill="none" stroke="#6A7897" stroke-opacity="0.45"/>

  <!-- ornamented corners -->
  <g stroke="#F6DB8B" stroke-width="2" fill="none">
    <path d="M50 78V50H78"/><path d="M1230 78V50H1202"/>
    <path d="M50 112V140H78"/><path d="M1230 112V140H1202"/>
  </g>

  <!-- side accent lines -->
  <path d="M120 95H520" stroke="url(#ftAccent)" stroke-width="1.4" opacity="0.6"/>
  <path d="M760 95H1160" stroke="url(#ftAccent)" stroke-width="1.4" opacity="0.6"/>

  <!-- travelling light on the lines -->
  <circle r="2.6" fill="#E0F2FE" filter="url(#ftGlow)">
    <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    <animateMotion path="M120 95H520" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.6" fill="#E0F2FE" filter="url(#ftGlow)">
    <animate attributeName="opacity" values="0;1;0" dur="5s" begin="2.5s" repeatCount="indefinite"/>
    <animateMotion path="M1160 95H760" dur="5s" begin="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- central emblem -->
  <g transform="translate(640 78)">
    <circle r="26" fill="url(#ftCore)" opacity="0.35"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle r="21" fill="#08101F" stroke="#F6DB8B" stroke-width="1.3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      <polygon points="0,-11 9,0 0,11 -9,0" fill="none" stroke="url(#ftAccent)" stroke-width="1.3"/>
    </g>
    <circle r="3.5" fill="#E0F2FE"/>
  </g>

  <text x="640" y="130" text-anchor="middle" fill="#F8FAFC"
        font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.4">ESTATÍSTICA • DADOS • PROGRAMAÇÃO • ANÁLISES</text>
  <text x="640" y="153" text-anchor="middle" fill="#94A3B8"
        font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Transformando dados em interpretação e decisão</text>

  <!-- floating particles -->
  <g fill="#E9D5FF">
    <circle cx="150" cy="60" r="1.4" opacity="0.6"><animate attributeName="cy" values="60;48;60" dur="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="66" r="1.4" opacity="0.6"><animate attributeName="cy" values="66;54;66" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="120" r="1.2" opacity="0.5"><animate attributeName="cx" values="1180;1194;1180" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="120" r="1.2" opacity="0.5"><animate attributeName="cx" values="110;124;110" dur="5.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
