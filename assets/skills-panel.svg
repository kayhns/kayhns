      <circle cy="337" cx="110" r="5" fill="#FDE68A" filter="url(#sGlow)"><animate attributeName="cx" from="110" to="374" dur="1.5s" begin="0.2s" fill="freeze"/><animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
