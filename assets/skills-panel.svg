<svg width="1280" height="962" viewBox="0 0 1280 962" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sTitle sDesc">
  <title id="sTitle">Visão geral de competências de Kayky Silva</title>
  <desc id="sDesc">Painel com ferramentas de Estatística, dados, programação, documentação e cloud, com barras qualitativas de familiaridade.</desc>
  <defs>
    <linearGradient id="sBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070C18"/><stop offset="0.52" stop-color="#10162A"/><stop offset="1" stop-color="#090F1E"/>
    </linearGradient>
    <linearGradient id="sPanel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#141D33"/><stop offset="1" stop-color="#0B1123"/>
    </linearGradient>
    <linearGradient id="sBorder" x1="0" y1="0" x2="1280" y2="912" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6DB8B"/><stop offset="0.4" stop-color="#8B5CF6"/><stop offset="0.75" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/>
      <animate attributeName="x1" values="0;400;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F4C95D"/><stop offset="0.5" stop-color="#C88A4A"/><stop offset="1" stop-color="#9B55C8"/>
    </linearGradient>
    <linearGradient id="barAqua" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#54D6D0"/><stop offset="1" stop-color="#4E8BDE"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6B7AA0" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="962" rx="28" fill="url(#sBg)"/>
  <rect x="18" y="18" width="1244" height="926" rx="24" fill="url(#sGrid)" stroke="url(#sBorder)" stroke-width="2"/>
  <rect x="31" y="31" width="1218" height="900" rx="19" fill="none" stroke="#6A7897" stroke-opacity="0.45"/>
  <rect x="52" y="50" width="1176" height="862" rx="18" fill="url(#sPanel)" stroke="#E0BD67" stroke-width="1.4"/>

  <!-- ornamented corners -->
  <g fill="#E0BD67">
    <path d="M52 88V50H90L79 61H63V77Z"/>
    <path d="M1190 50H1228V88L1217 77V61H1201Z"/>
    <path d="M52 874V912H90L79 901H63V885Z"/>
    <path d="M1190 912H1228V874L1217 885V901H1201Z"/>
  </g>

