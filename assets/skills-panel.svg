    <text x="88" y="100" fill="#F4C95D" font-size="12" font-weight="700" letter-spacing="3">VISÃO GERAL</text>
    <text x="88" y="140" fill="#F8FAFC" font-size="30" font-weight="700">Visão geral de competências</text>
    <text x="88" y="167" fill="#9EABC4" font-size="14">Familiaridade com ferramentas de Estatística, dados, programação e documentação</text>
    <text x="1192" y="167" text-anchor="end" fill="#6E7C97" font-size="12" font-style="italic">As barras indicam familiaridade, não certificação</text>

    <!-- section labels -->
    <path d="M88 200H1192" stroke="#3A465F"/>
    <path d="M88 200H420" stroke="#D9B765" stroke-width="2"/>
    <circle cx="88" cy="200" r="4" fill="#D9B765" filter="url(#sGlow)"/>
    <circle cx="660" cy="200" r="4" fill="#54D6D0" filter="url(#sGlow)"/>
