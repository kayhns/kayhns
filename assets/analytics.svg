<svg width="1280" height="340" viewBox="0 0 1280 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aTitle aDesc">
  <title id="aTitle">Análise e visualização de dados</title>
  <desc id="aDesc">Painel decorativo com gráfico de barras animado, linha de tendência e pontos, representando análise e visualização de dados.</desc>
  <defs>
    <linearGradient id="aBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070C18"/><stop offset="0.55" stop-color="#10162A"/><stop offset="1" stop-color="#090F1E"/>
    </linearGradient>
    <linearGradient id="aPanel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#141D33"/><stop offset="1" stop-color="#0B1123"/>
    </linearGradient>
    <linearGradient id="aBorder" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6DB8B"/><stop offset="0.4" stop-color="#8B5CF6"/><stop offset="0.75" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/>
      <animate attributeName="x1" values="0;400;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="aBar" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#9B55C8"/><stop offset="0.5" stop-color="#4E8BDE"/><stop offset="1" stop-color="#54D6D0"/>
    </linearGradient>
    <linearGradient id="aLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F6DB8B"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="aGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="aGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6B7AA0" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#aBg)"/>
  <rect x="18" y="18" width="1244" height="304" rx="20" fill="url(#aGrid)" stroke="url(#aBorder)" stroke-width="2"/>
  <rect x="31" y="31" width="1218" height="278" rx="16" fill="none" stroke="#6A7897" stroke-opacity="0.45"/>
  <rect x="52" y="46" width="1176" height="248" rx="14" fill="url(#aPanel)" stroke="#E0BD67" stroke-width="1.3"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="88" y="86" fill="#F4C95D" font-size="12" font-weight="700" letter-spacing="3">ANÁLISE E VISUALIZAÇÃO</text>
    <text x="88" y="114" fill="#F8FAFC" font-size="22" font-weight="700">Da exploração dos dados à interpretação</text>
    <path d="M88 132H1192" stroke="#3A465F"/>
    <path d="M88 132H320" stroke="#54D6D0" stroke-width="2"/>
    <circle cx="88" cy="132" r="4" fill="#54D6D0" filter="url(#aGlow)"/>
  </g>

  <!-- chart gridlines (baseline y=278, top y=158) -->
  <g stroke="#2A3552" stroke-width="1">
    <line x1="96" y1="158" x2="1184" y2="158"/>
    <line x1="96" y1="188" x2="1184" y2="188"/>
    <line x1="96" y1="218" x2="1184" y2="218"/>
    <line x1="96" y1="248" x2="1184" y2="248"/>
    <line x1="96" y1="278" x2="1184" y2="278"/>
  </g>

  <!-- animated bars: baseline 278, slot 66, width 34, start x=112 -->
  <g fill="url(#aBar)">
    <rect x="112" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="256" dur="1.3s" begin="0.15s" fill="freeze"/><animate attributeName="height" from="0" to="22" dur="1.3s" begin="0.15s" fill="freeze"/></rect>
    <rect x="178" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="242" dur="1.3s" begin="0.25s" fill="freeze"/><animate attributeName="height" from="0" to="36" dur="1.3s" begin="0.25s" fill="freeze"/></rect>
    <rect x="244" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="250" dur="1.3s" begin="0.35s" fill="freeze"/><animate attributeName="height" from="0" to="28" dur="1.3s" begin="0.35s" fill="freeze"/></rect>
    <rect x="310" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="230" dur="1.3s" begin="0.45s" fill="freeze"/><animate attributeName="height" from="0" to="48" dur="1.3s" begin="0.45s" fill="freeze"/></rect>
    <rect x="376" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="236" dur="1.3s" begin="0.55s" fill="freeze"/><animate attributeName="height" from="0" to="42" dur="1.3s" begin="0.55s" fill="freeze"/></rect>
    <rect x="442" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="218" dur="1.3s" begin="0.65s" fill="freeze"/><animate attributeName="height" from="0" to="60" dur="1.3s" begin="0.65s" fill="freeze"/></rect>
    <rect x="508" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="224" dur="1.3s" begin="0.75s" fill="freeze"/><animate attributeName="height" from="0" to="54" dur="1.3s" begin="0.75s" fill="freeze"/></rect>
    <rect x="574" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="206" dur="1.3s" begin="0.85s" fill="freeze"/><animate attributeName="height" from="0" to="72" dur="1.3s" begin="0.85s" fill="freeze"/></rect>
    <rect x="640" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="212" dur="1.3s" begin="0.95s" fill="freeze"/><animate attributeName="height" from="0" to="66" dur="1.3s" begin="0.95s" fill="freeze"/></rect>
    <rect x="706" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="194" dur="1.3s" begin="1.05s" fill="freeze"/><animate attributeName="height" from="0" to="84" dur="1.3s" begin="1.05s" fill="freeze"/></rect>
    <rect x="772" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="200" dur="1.3s" begin="1.15s" fill="freeze"/><animate attributeName="height" from="0" to="78" dur="1.3s" begin="1.15s" fill="freeze"/></rect>
    <rect x="838" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="182" dur="1.3s" begin="1.25s" fill="freeze"/><animate attributeName="height" from="0" to="96" dur="1.3s" begin="1.25s" fill="freeze"/></rect>
    <rect x="904" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="188" dur="1.3s" begin="1.35s" fill="freeze"/><animate attributeName="height" from="0" to="90" dur="1.3s" begin="1.35s" fill="freeze"/></rect>
    <rect x="970" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="172" dur="1.3s" begin="1.45s" fill="freeze"/><animate attributeName="height" from="0" to="106" dur="1.3s" begin="1.45s" fill="freeze"/></rect>
    <rect x="1036" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="178" dur="1.3s" begin="1.55s" fill="freeze"/><animate attributeName="height" from="0" to="100" dur="1.3s" begin="1.55s" fill="freeze"/></rect>
    <rect x="1102" y="278" width="34" height="0" rx="3"><animate attributeName="y" from="278" to="164" dur="1.3s" begin="1.65s" fill="freeze"/><animate attributeName="height" from="0" to="114" dur="1.3s" begin="1.65s" fill="freeze"/></rect>
  </g>

  <!-- trend line drawn over the bars (bar centers, ~8px above tops) -->
  <path d="M129 250 L195 236 L261 244 L327 224 L393 230 L459 212 L525 218 L591 200 L657 206 L723 188 L789 194 L855 176 L921 182 L987 166 L1053 172 L1119 158"
        fill="none" stroke="url(#aLine)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="1500" stroke-dashoffset="1500" filter="url(#aGlow)">
    <animate attributeName="stroke-dashoffset" from="1500" to="0" dur="2.2s" begin="0.3s" fill="freeze"/>
  </path>

  <!-- twinkling scatter points on the line -->
  <g fill="#F6DB8B">
    <circle cx="459" cy="212" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="723" cy="188" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1119" cy="158" r="3.5" fill="#E0F2FE" filter="url(#aGlow)"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
